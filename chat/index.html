<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Chat | BoostHub</title>
  <meta name="description" content="Interactive support chat interface for BoostHub.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand-link" href="/">
        <span class="brand-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        <span class="brand-text">Boost<span>Hub</span></span>
      </a>
      <a class="wallet-pill" href="/addfunds/" title="Wallet Balance">
        <span data-wallet-balance>₹0.00</span>
        <span class="wallet-plus">+</span>
      </a>
    </div>
  </header>

  <main class="app-main">
    
<div class="page-header-row">
  <a class="back-btn" href="/" aria-label="Back to home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
  <div>
    <h1 class="section-title" style="margin:0;">Support Chat</h1>
    <div style="font-size:0.86rem;color:var(--muted);">Email: support@boosthub.example · Demo Assistant</div>
  </div>
</div>

<div class="panel">
  <div id="chat-window" class="chat-window"></div>

  <div class="filter-tabs" style="margin-bottom:10px;">
    <button type="button" class="tab-btn" data-quick-msg="Where is my order?">Order Status</button>
    <button type="button" class="tab-btn" data-quick-msg="How do deposits work?">Deposit Help</button>
    <button type="button" class="tab-btn" data-quick-msg="What is the refill policy?">Refill Policy</button>
  </div>

  <form id="chat-form" class="chat-input-row">
    <input id="chat-input" class="form-control" type="text" placeholder="Type your message..." required>
    <button type="submit" class="btn-primary" style="width:auto;padding:11px 18px;">Send</button>
  </form>
</div>

  </main>

  

  <nav class="bottom-nav" aria-label="Main Navigation">
    <div class="bottom-nav-inner">
      <a class="nav-item" href="/orders/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>My Orders</span></a>
      <a class="nav-item" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Create Order</span></a>
      <a class="nav-item" href="/menu/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span>Menu</span></a>
    </div>
  </nav>

  <script src="/assets/services.js"></script>
  <script src="/assets/app.js"></script>
  
<script>
document.addEventListener("DOMContentLoaded", function () {
  var win = document.getElementById("chat-window");
  var input = document.getElementById("chat-input");
  var msgs = window.BoostHub.readJSON(window.BoostHub.KEYS.CHAT, [
    { role: "bot", text: "Hi! Welcome to BoostHub Demo Support. Ask about orders, wallet deposits, or refill rules." }
  ]);

  function replyFor(text) {
    var t = text.toLowerCase();
    if (t.indexOf("order") !== -1) return "You can inspect live demo order progress in My Orders (/orders/) and click 'Advance Demo Status' to test state changes.";
    if (t.indexOf("deposit") !== -1 || t.indexOf("fund") !== -1 || t.indexOf("pay") !== -1) return "Open Add Funds (/addfunds/) to simulate adding INR balance, or claim a daily bonus from the Spin Wheel!";
    if (t.indexOf("refill") !== -1) return "Eligible High Retention services include a 30-day refill policy when accounts remain public.";
    return "Thanks for reaching out! In a production setup, connect this chat UI to your backend ticket API or support desk.";
  }

  function render() {
    win.innerHTML = msgs.map(function (m) {
      var cls = m.role === "user" ? "chat-msg chat-user" : "chat-msg chat-bot";
      return '<div class="' + cls + '">' + window.BoostHub.escapeHtml(m.text) + '</div>';
    }).join("");
    win.scrollTop = win.scrollHeight;
  }

  function send(text) {
    if (!text.trim()) return;
    msgs.push({ role: "user", text: text.trim() });
    msgs.push({ role: "bot", text: replyFor(text) });
    window.BoostHub.writeJSON(window.BoostHub.KEYS.CHAT, msgs.slice(-30));
    render();
  }

  var quickBtns = document.querySelectorAll("[data-quick-msg]");
  for (var i = 0; i < quickBtns.length; i++) {
    quickBtns[i].addEventListener("click", function () {
      send(this.getAttribute("data-quick-msg"));
    });
  }

  document.getElementById("chat-form").addEventListener("submit", function (e) {
    e.preventDefault();
    send(input.value);
    input.value = "";
  });

  render();
});
</script>

</body>
</html>
