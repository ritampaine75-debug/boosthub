<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Chat — BoostHub Help Desk</title>
  <meta name="description" content="Ask questions about orders, wallet deposits, or refill rules on BoostHub support chat. Demo assistant available.">
  <meta name="theme-color" content="#2563eb">
  <link rel="canonical" href="https://boosthub-seven.vercel.app/chat/">
  <meta property="og:title" content="Support Chat — BoostHub">
  <meta property="og:description" content="BoostHub support chat for orders, wallet, and refill questions.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://boosthub-seven.vercel.app/chat/">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand-link" href="/">
        <span class="brand-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        <span class="brand-text">Boost<span>Hub</span></span>
      </a>
      <a class="wallet-pill" href="/addfunds/" title="Wallet Balance">
        <span data-wallet-balance>₹0.00</span>
        <span class="wallet-plus">+</span>
      </a>
    </div>
  </header>

  <main class="app-main">
    <div class="page-header-row">
      <a class="back-btn" href="/menu/" aria-label="Back to menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <h1 class="section-title" style="margin:0;">Support Chat</h1>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <span class="platform-icon icon-accent" style="width:32px;height:32px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <div>
          <div style="font-weight:700;font-size:0.9rem;">support@boosthub.example</div>
          <div style="font-size:0.8rem;color:var(--muted);">Demo Assistant</div>
        </div>
      </div>

      <div class="chat-window" id="chat-window">
        <div class="chat-msg chat-bot">Hi! Welcome to BoostHub Demo Support. Ask about orders, wallet deposits, or refill rules.</div>
      </div>

      <div class="chat-input-row">
        <input type="text" class="form-control" id="chat-input" placeholder="Type your message...">
        <button type="button" class="btn-primary" id="chat-send" style="width:auto;padding:11px 16px;font-size:0.85rem;">Send</button>
      </div>

      <div style="margin-top:10px;display:flex;gap:8px;">
        <button type="button" class="btn-secondary" style="font-size:0.8rem;padding:6px 10px;" onclick="quickMsg('Order Status')">Order Status</button>
        <button type="button" class="btn-secondary" style="font-size:0.8rem;padding:6px 10px;" onclick="quickMsg('Deposit Help')">Deposit Help</button>
        <button type="button" class="btn-secondary" style="font-size:0.8rem;padding:6px 10px;" onclick="quickMsg('Refill Policy')">Refill Policy</button>
      </div>
    </div>

  </main>

  <div class="fab-stack">
    <button type="button" class="fab-btn fab-accent" data-open-spin><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span>Daily Bonus</span></button>
    <a class="fab-btn" href="/chat/"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Support</span></a>
  </div>

  <nav class="bottom-nav" aria-label="Main Navigation">
    <div class="bottom-nav-inner">
      <a class="nav-item" href="/orders/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>My Orders</span></a>
      <a class="nav-item" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Create Order</span></a>
      <a class="nav-item" href="/menu/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span>Menu</span></a>
    </div>
  </nav>

  <script src="/assets/services.js"></script>
  <script src="/assets/app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
function quickMsg(msg) {
  document.getElementById("chat-input").value = msg;
}
document.addEventListener("DOMContentLoaded", function () {
  var chatWindow = document.getElementById("chat-window");
  var chatInput = document.getElementById("chat-input");
  var chatSend = document.getElementById("chat-send");

  function addMsg(text, type) {
    var div = document.createElement("div");
    div.className = "chat-msg chat-" + type;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function send() {
    var text = chatInput.value.trim();
    if (!text) return;
    addMsg(text, "user");
    chatInput.value = "";
    setTimeout(function () {
      var replies = [
        "Thanks! I've noted your request.",
        "Our demo team will respond shortly.",
        "Check your order status in the My Orders section.",
        "For UPI deposits, use the Add Funds page to simulate a top-up.",
        "Refill policy: 30-day drop protection on eligible services."
      ];
      var r = replies[Math.floor(Math.random() * replies.length)];
      addMsg(r, "bot");
    }, 800);
  }

  chatSend.addEventListener("click", send);
  chatInput.addEventListener("keypress", function (e) {
    if (e.key === "Enter") send();
  });
});
</script>
</body>
</html>
