    </div>

    <div id="platform-service-list" class="service-stack"></div>

  </main>

  <div class="fab-stack">
    <button type="button" class="fab-btn fab-accent" data-open-spin><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span>Daily Bonus</span></button>

  <script src="/assets/services.js"></script>
  <script src="/assets/app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", function () {
  var container = document.getElementById("platform-service-list");
  var platform = window.BOOSTHUB_CATALOG.platforms["instagram"];
  if (!platform || !container) return;
  container.innerHTML = platform.services.map(function (svc) {
    return (
      '<a class="service-card" href="/order/?serviceid=' + encodeURIComponent(svc.id) + '">' +
        '<div class="service-card-left">' +
          '<span class="platform-icon icon-instagram"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></span>' +
          '<div class="service-meta">' +
            '<div class="service-title">' + window.BoostHub.escapeHtml(svc.name) + '</div>' +
            '<div class="service-desc">' + window.BoostHub.escapeHtml(svc.category) + ' · ETA: ' + window.BoostHub.escapeHtml(svc.eta) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="service-right">' +
          '<span class="price-tag">₹' + svc.ratePer1k + '/1k</span>' +
          '<span class="arrow-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>' +
        '</div>' +
      '</a>'
    );
  }).join("");
});
</script>
</body>
