<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Order History & Tracking | BoostHub</title>
  <meta name="description" content="Track your order status and history on BoostHub. View pending, processing, and completed orders in your demo wallet account.">
  <meta name="theme-color" content="#2563eb">
  <link rel="canonical" href="https://boosthub-seven.vercel.app/orders/">
  <meta property="og:title" content="My Orders — BoostHub">
  <meta property="og:description" content="Track your SMM order history and status on BoostHub.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://boosthub-seven.vercel.app/orders/">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand-link" href="/">
        <span class="brand-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        <span class="brand-text">Boost<span>Hub</span></span>
      </a>
      <a class="wallet-pill" href="/addfunds/" title="Wallet Balance">
        <span data-wallet-balance>₹0.00</span>
        <span class="wallet-plus">+</span>
      </a>
    </div>
  </header>

  <main class="app-main">
    <div class="page-header-row">
      <a class="back-btn" href="/" aria-label="Back to home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <h1 class="section-title" style="margin:0;">My Orders</h1>
    </div>

    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="all">All</button>
      <button class="tab-btn" data-filter="Pending">Pending</button>
      <button class="tab-btn" data-filter="Processing">Processing</button>
      <button class="tab-btn" data-filter="Completed">Completed</button>
    </div>

    <div id="orders-list" class="admin-list"></div>

    <p style="margin-top:14px;text-align:center;">
      <a href="/" class="btn-secondary">Create Your First Order</a>
    </p>

  </main>

  <div class="fab-stack">
    <button type="button" class="fab-btn fab-accent" data-open-spin><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span>Daily Bonus</span></button>
    <a class="fab-btn" href="/chat/"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Support</span></a>
  </div>

  <nav class="bottom-nav" aria-label="Main Navigation">
    <div class="bottom-nav-inner">
      <a class="nav-item" href="/orders/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>My Orders</span></a>
      <a class="nav-item" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Create Order</span></a>
      <a class="nav-item" href="/menu/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span>Menu</span></a>
    </div>
  </nav>

  <script src="/assets/services.js"></script>
  <script src="/assets/app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", function () {
  var ordersList = document.getElementById("orders-list");
  var filterBtns = document.querySelectorAll(".filter-tabs .tab-btn");

  function renderOrders(filter) {
    var orders = window.BoostHub.readJSON(window.BoostHub.KEYS.ORDERS, []);
    if (filter !== "all") {
      orders = orders.filter(function (o) { return o.status === filter; });
    }
    if (orders.length === 0) {
      ordersList.innerHTML = "<p style='color:var(--muted);font-size:0.88rem;text-align:center;padding:20px;'>No orders found.</p>";
      return;
    }
    var html = "<table style='width:100%;border-collapse:collapse;font-size:0.86rem;'><thead><tr style='text-align:left;color:var(--muted);'><th style='padding:8px;border-bottom:1px solid var(--border-subtle);'>Order ID</th><th style='padding:8px;border-bottom:1px solid var(--border-subtle);'>Service</th><th style='padding:8px;border-bottom:1px solid var(--border-subtle);'>Platform</th><th style='padding:8px;border-bottom:1px solid var(--border-subtle);'>Charge</th><th style='padding:8px;border-bottom:1px solid var(--border-subtle);'>Status</th></tr></thead><tbody>";
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i];
      html += "<tr><td style='padding:8px;border-bottom:1px solid var(--border-subtle);font-weight:700;'>" + escapeHtml(o.id || "ORD-" + i) + "</td>" +
        "<td style='padding:8px;border-bottom:1px solid var(--border-subtle);'>" + escapeHtml(o.serviceName || "Service Order") + "</td>" +
        "<td style='padding:8px;border-bottom:1px solid var(--border-subtle);'>" + escapeHtml(o.platform || "") + "</td>" +
        "<td style='padding:8px;border-bottom:1px solid var(--border-subtle);'>" + window.BoostHub.formatINR(o.charge || 0) + "</td>" +
        "<td style='padding:8px;border-bottom:1px solid var(--border-subtle);'><span class='badge badge-" + (o.status || "pending").toLowerCase() + "'>" + (o.status || "Pending") + "</span></td></tr>";
    }
    html += "</tbody></table>";
    ordersList.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  for (var i = 0; i < filterBtns.length; i++) {
    filterBtns[i].addEventListener("click", function () {
      for (var j = 0; j < filterBtns.length; j++) filterBtns[j].classList.remove("active");
      this.classList.add("active");
      renderOrders(this.getAttribute("data-filter"));
    });
  }
  renderOrders("all");
});
</script>
</body>
</html>
