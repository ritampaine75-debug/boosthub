<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | BoostHub</title>
  <meta name="description" content="Track and filter your orders on BoostHub.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand-link" href="/">
        <span class="brand-badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
        <span class="brand-text">Boost<span>Hub</span></span>
      </a>
      <a class="wallet-pill" href="/addfunds/" title="Wallet Balance">
        <span data-wallet-balance>₹0.00</span>
        <span class="wallet-plus">+</span>
      </a>
    </div>
  </header>

  <main class="app-main">
    
<div class="page-header-row" style="justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:10px;">
    <a class="back-btn" href="/" aria-label="Back to home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <h1 class="section-title" style="margin:0;">My Orders</h1>
  </div>
  <button type="button" id="refresh-orders-btn" class="btn-secondary">Advance Demo Status</button>
</div>

<div class="form-group">
  <input id="order-search" class="form-control" type="search" placeholder="Search by Order ID, service, or link...">
</div>

<div class="filter-tabs">
  <button type="button" class="tab-btn active" data-filter="All">All</button>
  <button type="button" class="tab-btn" data-filter="Pending">Pending</button>
  <button type="button" class="tab-btn" data-filter="Processing">Processing</button>
  <button type="button" class="tab-btn" data-filter="Completed">Completed</button>
</div>

<div id="orders-container" class="service-stack"></div>

  </main>

  
<div class="fab-stack">
  <button type="button" class="fab-btn fab-accent" data-open-spin><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span>Daily Bonus</span></button>
  <a class="fab-btn" href="/chat/"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Support</span></a>
</div>


  <nav class="bottom-nav" aria-label="Main Navigation">
    <div class="bottom-nav-inner">
      <a class="nav-item" href="/orders/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>My Orders</span></a>
      <a class="nav-item" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Create Order</span></a>
      <a class="nav-item" href="/menu/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span>Menu</span></a>
    </div>
  </nav>

  <script src="/assets/services.js"></script>
  <script src="/assets/app.js"></script>
  
<script>
document.addEventListener("DOMContentLoaded", function () {
  var currentFilter = "All";
  var searchEl = document.getElementById("order-search");
  var container = document.getElementById("orders-container");
  var tabs = document.querySelectorAll("[data-filter]");

  function badgeClass(status) {
    if (status === "Completed") return "badge badge-completed";
    if (status === "Processing") return "badge badge-processing";
    return "badge badge-pending";
  }

  function render() {
    var orders = window.BoostHub.readJSON(window.BoostHub.KEYS.ORDERS, []);
    var q = (searchEl.value || "").toLowerCase().trim();
    var filtered = orders.filter(function (o) {
      var matchTab = currentFilter === "All" || o.status === currentFilter;
      var matchQ = !q || o.id.toLowerCase().indexOf(q) !== -1 || o.serviceName.toLowerCase().indexOf(q) !== -1 || o.link.toLowerCase().indexOf(q) !== -1;
      return matchTab && matchQ;
    });

    if (!filtered.length) {
      container.innerHTML =
        '<div class="panel" style="text-align:center;padding:28px 18px;">' +
          '<p style="margin:0 0 12px;color:var(--muted);">No orders found in this view.</p>' +
          '<a class="btn-primary" style="display:inline-block;width:auto;padding:10px 18px;" href="/">Create Your First Order</a>' +
        '</div>';
      return;
    }

    container.innerHTML = filtered.map(function (o) {
      return (
        '<div class="panel" style="margin-bottom:0;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">' +
            '<strong>' + window.BoostHub.escapeHtml(o.id) + '</strong>' +
            '<span class="' + badgeClass(o.status) + '">' + window.BoostHub.escapeHtml(o.status) + '</span>' +
          '</div>' +
          '<div style="font-weight:700;margin-bottom:4px;">' + window.BoostHub.escapeHtml(o.serviceName) + '</div>' +
          '<div style="font-size:0.83rem;color:var(--muted);word-break:break-all;margin-bottom:10px;">Target: ' + window.BoostHub.escapeHtml(o.link) + '</div>' +
          '<div style="display:flex;justify-content:space-between;font-size:0.85rem;border-top:1px dashed var(--border-subtle);padding-top:8px;">' +
            '<span>Qty: <strong>' + Number(o.qty).toLocaleString() + '</strong></span>' +
            '<span>Charge: <strong style="color:var(--accent);">' + window.BoostHub.formatINR(o.charge) + '</strong></span>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener("click", function () {
      currentFilter = this.getAttribute("data-filter");
      for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");
      this.classList.add("active");
      render();
    });
  }

  searchEl.addEventListener("input", render);

  document.getElementById("refresh-orders-btn").addEventListener("click", function () {
    var orders = window.BoostHub.readJSON(window.BoostHub.KEYS.ORDERS, []);
    if (!orders.length) {
      window.BoostHub.toast("No orders yet to update.");
      return;
    }
    var changed = 0;
    orders = orders.map(function (o) {
      if (o.status === "Pending") { o.status = "Processing"; changed++; }
      else if (o.status === "Processing") { o.status = "Completed"; changed++; }
      return o;
    });
    window.BoostHub.writeJSON(window.BoostHub.KEYS.ORDERS, orders);
    render();
    window.BoostHub.toast(changed ? "Updated " + changed + " order(s)." : "All orders are already Completed.");
  });

  render();
});
</script>

</body>
</html>
